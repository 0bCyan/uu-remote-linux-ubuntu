# ~/.config/systemd/user/uuremote-native.service.d/virtual-display.conf
# Serve the virtual desktop instead of a physical display.
[Unit]
Requires=uu-virtual-desktop.service
After=uu-virtual-desktop.service

[Service]
Environment=DISPLAY=:99
Environment=UU_DESKTOP_BACKEND=x11
Environment=XAUTHORITY=%t/uu-virtual-99.Xauthority
UnsetEnvironment=WAYLAND_DISPLAY
